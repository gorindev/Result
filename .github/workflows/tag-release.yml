name: Tag release

# When a release/hotfix is merged into main, tag it with the csproj version and publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          V=$(grep -oPm1 '(?<=<Version>)[0-9]+\.[0-9]+\.[0-9]+(?=</Version>)' src/Gorin.Result/Gorin.Result.csproj)
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "Tag v$V exists; version was not bumped."; echo "created=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release $V"
          git push origin "v$V"
          echo "created=true" >> "$GITHUB_OUTPUT"
  publish:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

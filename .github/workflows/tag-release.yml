name: Tag release

# When a release/hotfix is merged into main, tag it with the csproj version and publish.
on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write # required to start publish.yml

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oPm1 '(?<=<Version>)[0-9]+\.[0-9]+\.[0-9]+(?=</Version>)' src/Gorin.Result/Gorin.Result.csproj)
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "Tag v$V exists; version was not bumped."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release $V"
          git push origin "v$V"
          # Tags pushed with GITHUB_TOKEN do not trigger push workflows, so start publish.yml directly.
          # publish.yml then runs as the top-level workflow, which is what the NuGet trusted publishing policy checks.
          gh workflow run publish.yml --ref "v$V"
